name: Sincronizar para-casas do Notion

on:
  workflow_dispatch:
  schedule:
    - cron: '32 5 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar configuração do Notion
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARA_CASA_DATA_SOURCE_ID: ${{ vars.NOTION_PARA_CASA_DATA_SOURCE_ID }}
        run: |
          faltando=()
          [[ -n "$NOTION_TOKEN" ]] || faltando+=("secret NOTION_TOKEN")
          [[ -n "$NOTION_PARA_CASA_DATA_SOURCE_ID" ]] || faltando+=("variable NOTION_PARA_CASA_DATA_SOURCE_ID")

          if (( ${#faltando[@]} )); then
            lista=$(IFS=', '; echo "${faltando[*]}")
            echo "::error title=Configuração do Notion ausente::Cadastre no repositório: $lista. Acesse Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Gerar dados dos para-casas
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARA_CASA_DATA_SOURCE_ID: ${{ vars.NOTION_PARA_CASA_DATA_SOURCE_ID }}
        run: node scripts/sync-para-casa.js

      - name: Registrar atualização quando houver mudança
        run: |
          if git diff --quiet -- data/para-casa.json; then
            echo "Sem alterações em data/para-casa.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/para-casa.json
          git commit -m "chore: sincronizar para-casas do Notion"
          git push
